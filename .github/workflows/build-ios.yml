name: Build Psych Engine 0.7.3 iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ─────────────────────────────────────────
      # 1. Código fuente de Psych Engine 0.7.3
      # ─────────────────────────────────────────
      - name: Checkout Psych Engine 0.7.3
        uses: actions/checkout@v4
        with:
          repository: ShadowMario/FNF-PsychEngine
          ref: '0.7.3'

      # ─────────────────────────────────────────
      # 2. Haxe via Homebrew
      # ─────────────────────────────────────────
      - name: Setup Haxe
        run: |
          brew install haxe
          haxe --version

      # ─────────────────────────��───────────────
      # 3. Cache de librerías
      # ─────────────────────────────────────────
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-psych-ios-${{ hashFiles('**/Project.xml') }}
          restore-keys: haxelib-psych-ios-

      # ─────────────────────────────────────────
      # 4. Dependencias Haxe
      # ─────────────────────────────────────────
      - name: Install Haxe dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp         4.3.2  --quiet
          haxelib install lime          8.1.2  --quiet
          haxelib install openfl        9.3.3  --quiet
          haxelib install flixel        5.4.0  --quiet
          haxelib install flixel-addons 3.2.2  --quiet
          haxelib install flixel-ui     2.5.0  --quiet
          haxelib install hscript       2.5.0  --quiet
          haxelib install actuate       1.9.0  --quiet
          haxelib install SScript       7.0.12 --quiet
          haxelib install hxCodec       3.0.2  --quiet
          haxelib run lime setup -y

      # ─────────────────────────────────────────
      # 5. Crear TouchControls.hx
      #    Zonas táctiles invisibles estilo FNF mobile:
      #    Pantalla dividida en 4 franjas verticales = LEFT DOWN UP RIGHT
      # ─────────────────────────────────────────
      - name: Create TouchControls.hx
        run: |
          mkdir -p source/mobile
          cat > source/mobile/TouchControls.hx << 'HAXEOF'
          package mobile;

          import flixel.FlxG;
          import flixel.util.FlxColor;
          import flixel.input.touch.FlxTouch;

          /**
           * Control táctil estilo FNF mobile.
           * Divide la mitad inferior de la pantalla en 4 zonas:
           *   [  LEFT  |  DOWN  |   UP   | RIGHT  ]
           * Sin ningún botón visible — toque invisible.
           */
          class TouchControls
          {
              // Estado actual de cada dirección
              public static var left(default, null):Bool   = false;
              public static var down(default, null):Bool   = false;
              public static var up(default, null):Bool     = false;
              public static var right(default, null):Bool  = false;

              // Presionado justo este frame (para acciones únicas)
              public static var leftP(default, null):Bool  = false;
              public static var downP(default, null):Bool  = false;
              public static var upP(default, null):Bool    = false;
              public static var rightP(default, null):Bool = false;

              // Soltado justo este frame
              public static var leftR(default, null):Bool  = false;
              public static var downR(default, null):Bool  = false;
              public static var upR(default, null):Bool    = false;
              public static var rightR(default, null):Bool = false;

              // Zona táctil: mitad inferior de la pantalla
              static inline var TOUCH_ZONE_Y_RATIO:Float = 0.45;

              static var _prevLeft:Bool  = false;
              static var _prevDown:Bool  = false;
              static var _prevUp:Bool    = false;
              static var _prevRight:Bool = false;

              public static function update():Void
              {
                  _prevLeft  = left;
                  _prevDown  = down;
                  _prevUp    = up;
                  _prevRight = right;

                  left  = false;
                  down  = false;
                  up    = false;
                  right = false;

                  var sw:Float = FlxG.width;
                  var sh:Float = FlxG.height;
                  var zoneY:Float = sh * TOUCH_ZONE_Y_RATIO;
                  var zoneW:Float = sw / 4;

                  for (touch in FlxG.touches.list)
                  {
                      if (!touch.active) continue;

                      var tx:Float = touch.x;
                      var ty:Float = touch.y;

                      // Solo zona inferior
                      if (ty < zoneY) continue;

                      if (tx < zoneW)                        left  = true;
                      else if (tx < zoneW * 2)               down  = true;
                      else if (tx < zoneW * 3)               up    = true;
                      else                                   right = true;
                  }

                  leftP  = left  && !_prevLeft;
                  downP  = down  && !_prevDown;
                  upP    = up    && !_prevUp;
                  rightP = right && !_prevRight;

                  leftR  = !left  && _prevLeft;
                  downR  = !down  && _prevDown;
                  upR    = !up    && _prevUp;
                  rightR = !right && _prevRight;
              }

              /**
               * Cualquier zona tocada (útil para "tap para continuar")
               */
              public static function anyPressed():Bool
              {
                  return FlxG.touches.list.length > 0;
              }

              public static function anyJustPressed():Bool
              {
                  for (touch in FlxG.touches.list)
                      if (touch.justPressed) return true;
                  return false;
              }
          }
          HAXEOF
          echo "TouchControls.hx creado"

      # ─────────────────────────────────────────
      # 6. Crear MobileMenuHelper.hx
      #    Ayudante para menús: swipe arriba/abajo y tap para confirmar
      # ─────────────────────────────────────────
      - name: Create MobileMenuHelper.hx
        run: |
          cat > source/mobile/MobileMenuHelper.hx << 'HAXEOF'
          package mobile;

          import flixel.FlxG;

          /**
           * Detecta gestos para navegar menús en iOS sin botones:
           *   - Swipe arriba   → arriba
           *   - Swipe abajo    → abajo
           *   - Tap rápido     → confirmar
           *   - Swipe derecha  → volver (back)
           */
          class MobileMenuHelper
          {
              public static var swipeUp(default, null):Bool    = false;
              public static var swipeDown(default, null):Bool  = false;
              public static var swipeLeft(default, null):Bool  = false;
              public static var swipeRight(default, null):Bool = false;
              public static var tapped(default, null):Bool     = false;

              static inline var SWIPE_THRESHOLD:Float = 40;
              static inline var TAP_THRESHOLD:Float   = 15;
              static var _startX:Float = 0;
              static var _startY:Float = 0;
              static var _tracking:Bool = false;

              public static function update():Void
              {
                  swipeUp    = false;
                  swipeDown  = false;
                  swipeLeft  = false;
                  swipeRight = false;
                  tapped     = false;

                  for (touch in FlxG.touches.list)
                  {
                      if (touch.justPressed)
                      {
                          _startX   = touch.x;
                          _startY   = touch.y;
                          _tracking = true;
                      }

                      if (touch.justReleased && _tracking)
                      {
                          var dx:Float = touch.x - _startX;
                          var dy:Float = touch.y - _startY;
                          var dist:Float = Math.sqrt(dx * dx + dy * dy);

                          if (dist < TAP_THRESHOLD)
                          {
                              tapped = true;
                          }
                          else if (Math.abs(dy) > Math.abs(dx))
                          {
                              if (dy < -SWIPE_THRESHOLD)      swipeUp   = true;
                              else if (dy > SWIPE_THRESHOLD)  swipeDown = true;
                          }
                          else
                          {
                              if (dx > SWIPE_THRESHOLD)       swipeRight = true;
                              else if (dx < -SWIPE_THRESHOLD) swipeLeft  = true;
                          }
                          _tracking = false;
                      }
                  }
              }
          }
          HAXEOF
          echo "MobileMenuHelper.hx creado"

      # ─────────────────────────────────────────
      # 7. Parchar Controls.hx — integrar touch en el sistema de controles
      # ─────────────────────────────────────────
      - name: Patch Controls.hx for touch input
        run: |
          python3 << 'PYEOF'
          import os, re

          path = 'source/backend/Controls.hx'
          if not os.path.exists(path):
              path = 'source/Controls.hx'

          if not os.path.exists(path):
              print("No se encontro Controls.hx, omitiendo")
              exit(0)

          with open(path, 'r') as f:
              src = f.read()

          # Inyectar import de TouchControls
          if 'mobile.TouchControls' not in src:
              src = src.replace('package backend;', 'package backend;\n#if ios\nimport mobile.TouchControls;\n#end')
              print("Import TouchControls inyectado")

          # Parchar el getter de LEFT held
          patterns = [
              # Patrón típico de Psych Engine para detectar teclas
              (r'(inline public function get_LEFT\(\):Bool\s*\{[^}]*?\bkeys\b[^}]*?\})',
               lambda m: m.group(0).rstrip('}') + '\n\t\t#if ios\n\t\t|| TouchControls.left\n\t\t#end\n\t}'),
              (r'(inline public function get_DOWN\(\):Bool\s*\{[^}]*?\bkeys\b[^}]*?\})',
               lambda m: m.group(0).rstrip('}') + '\n\t\t#if ios\n\t\t|| TouchControls.down\n\t\t#end\n\t}'),
              (r'(inline public function get_UP\(\):Bool\s*\{[^}]*?\bkeys\b[^}]*?\})',
               lambda m: m.group(0).rstrip('}') + '\n\t\t#if ios\n\t\t|| TouchControls.up\n\t\t#end\n\t}'),
              (r'(inline public function get_RIGHT\(\):Bool\s*\{[^}]*?\bkeys\b[^}]*?\})',
               lambda m: m.group(0).rstrip('}') + '\n\t\t#if ios\n\t\t|| TouchControls.right\n\t\t#end\n\t}'),
          ]

          patched = False
          for pattern, replacement in patterns:
              new_src = re.sub(pattern, replacement, src, flags=re.DOTALL)
              if new_src != src:
                  src = new_src
                  patched = True

          with open(path, 'w') as f:
              f.write(src)

          if patched:
              print("Controls.hx parcheado con touch input")
          else:
              print("Controls.hx: patron no encontrado — se usara fallback directo en PlayState")
          PYEOF

      # ─────────────────────────────────────────
      # 8. Parchar PlayState.hx — actualizar TouchControls cada frame
      #    + usar zonas táctiles directamente para notas
      # ─────────────────────────────────────────
      - name: Patch PlayState.hx for touch gameplay
        run: |
          python3 << 'PYEOF'
          import os, re

          path = 'source/states/PlayState.hx'
          if not os.path.exists(path):
              print("No se encontro PlayState.hx, omitiendo")
              exit(0)

          with open(path, 'r') as f:
              src = f.read()

          # 1. Agregar import
          if 'mobile.TouchControls' not in src:
              # Buscar primer import para insertar antes
              src = re.sub(
                  r'^(import )',
                  '#if ios\nimport mobile.TouchControls;\n#end\nimport ',
                  src, count=1, flags=re.MULTILINE
              )
              print("Import TouchControls agregado a PlayState")

          # 2. Llamar TouchControls.update() al inicio del update principal
          # Buscar override function update(elapsed
          update_pattern = r'(override\s+function\s+update\s*\(elapsed\s*:\s*Float\)\s*\{)'
          touch_update = r'\1\n\t\t#if ios\n\t\tTouchControls.update();\n\t\t#end'
          new_src = re.sub(update_pattern, touch_update, src, count=1)
          if new_src != src:
              src = new_src
              print("TouchControls.update() insertado en PlayState.update()")

          # 3. Hacer que las notas respondan a touch además de teclas
          # Psych Engine usa keyShit / keys array para detectar pulsaciones
          # Inyectamos touch en el array de inputs
          key_press_pattern = r'(var holdArray:Array<Bool>\s*=\s*\[)(.*?)(\];)'
          def inject_touch(m):
              inner = m.group(2)
              touch_inject = (
                  '#if ios\n\t\tTouchControls.update();\n\t\t#end\n\t\t' +
                  m.group(1) + inner + m.group(3)
              )
              return touch_inject

          # Buscar el holdArray que contiene controles LEFT/DOWN/UP/RIGHT
          hold_pattern = r'(holdArray\s*=\s*\[controls\.LEFT_P,\s*controls\.DOWN_P,\s*controls\.UP_P,\s*controls\.RIGHT_P\])'
          touch_hold   = (r'holdArray = ['
                          r'controls.LEFT_P  #if ios || TouchControls.leftP  #end, '
                          r'controls.DOWN_P  #if ios || TouchControls.downP  #end, '
                          r'controls.UP_P    #if ios || TouchControls.upP    #end, '
                          r'controls.RIGHT_P #if ios || TouchControls.rightP #end]')
          new_src = re.sub(hold_pattern, touch_hold, src)
          if new_src != src:
              src = new_src
              print("holdArray parcheado con touch")

          # Mismo parche para el array de hold continuo
          held_pattern = r'(holdArray\s*=\s*\[controls\.LEFT,\s*controls\.DOWN,\s*controls\.UP,\s*controls\.RIGHT\])'
          touch_held   = (r'holdArray = ['
                          r'controls.LEFT  #if ios || TouchControls.left  #end, '
                          r'controls.DOWN  #if ios || TouchControls.down  #end, '
                          r'controls.UP    #if ios || TouchControls.up    #end, '
                          r'controls.RIGHT #if ios || TouchControls.right #end]')
          new_src = re.sub(held_pattern, touch_held, src)
          if new_src != src:
              src = new_src
              print("holdArray (held) parcheado con touch")

          with open(path, 'w') as f:
              f.write(src)

          print("PlayState.hx listo")
          PYEOF

      # ─────────────────────────────────────────
      # 9. Parchar menús para navegación táctil
      #    MainMenuState, FreeplayState, StoryMenuState, PauseSubState
      # ─────────────────────────────────────────
      - name: Patch menus for touch navigation
        run: |
          python3 << 'PYEOF'
          import os, re, glob

          MENU_FILES = [
              'source/states/MainMenuState.hx',
              'source/states/FreeplayState.hx',
              'source/states/StoryMenuState.hx',
              'source/states/TitleState.hx',
              'source/substates/PauseSubState.hx',
              'source/states/GameOverSubstate.hx',
          ]

          IMPORT_BLOCK = '#if ios\nimport mobile.MobileMenuHelper;\n#end\n'

          for path in MENU_FILES:
              if not os.path.exists(path):
                  print(f"No encontrado: {path}")
                  continue

              with open(path, 'r') as f:
                  src = f.read()

              changed = False

              # Agregar import si no existe
              if 'MobileMenuHelper' not in src:
                  src = re.sub(r'^(import )', IMPORT_BLOCK + r'import ', src, count=1, flags=re.MULTILINE)
                  changed = True

              # Inyectar MobileMenuHelper.update() en el update()
              update_pat = r'(override\s+function\s+update\s*\(elapsed\s*:\s*Float\)\s*\{)'
              helper_call = r'\1\n\t\t#if ios\n\t\tMobileMenuHelper.update();\n\t\t#end'
              new_src = re.sub(update_pat, helper_call, src, count=1)
              if new_src != src:
                  src = new_src
                  changed = True

              # Reemplazar controles de teclado de menú por swipe/tap
              # Patron: if (controls.UI_UP_P)  → también responde a swipeUp
              for direction in ['UP', 'DOWN', 'LEFT', 'RIGHT']:
                  pat = rf'(controls\.UI_{direction}_P)'
                  rep = rf'(controls.UI_{direction}_P #if ios || MobileMenuHelper.swipe{direction.capitalize()} #end)'
                  new_src = re.sub(pat, rep, src)
                  if new_src != src:
                      src = new_src
                      changed = True

              # ENTER/ACCEPT → tap
              for accept in ['controls.ACCEPT', 'controls.UI_ACCEPT']:
                  pat = rf'({re.escape(accept)})'
                  rep = rf'(\1 #if ios || MobileMenuHelper.tapped #end)'
                  new_src = re.sub(pat, rep, src)
                  if new_src != src:
                      src = new_src
                      changed = True

              # BACK → swipe derecha
              for back in ['controls.BACK']:
                  pat = rf'({re.escape(back)})'
                  rep = rf'(\1 #if ios || MobileMenuHelper.swipeRight #end)'
                  new_src = re.sub(pat, rep, src)
                  if new_src != src:
                      src = new_src
                      changed = True

              if changed:
                  with open(path, 'w') as f:
                      f.write(src)
                  print(f"Parcheado: {path}")
              else:
                  print(f"Sin cambios: {path}")
          PYEOF

      # ─────────────────────────────────────────
      # 10. Parchar Project.xml — File Sharing + iOS 14 + orientación landscape
      # ─────────────────────────────────────────
      - name: Patch Project.xml
        run: |
          python3 << 'PYEOF'
          with open('Project.xml', 'r') as f:
              xml = f.read()

          ios_block = """
              <!-- iOS: File Sharing, orientacion landscape forzada, iOS 14+ -->
              <ios deployment="14.0">
                  <plist>
                      <key>UIFileSharingEnabled</key>
                      <true/>
                      <key>LSSupportsOpeningDocumentsInPlace</key>
                      <true/>
                      <key>UISupportedInterfaceOrientations</key>
                      <array>
                          <string>UIInterfaceOrientationLandscapeLeft</string>
                          <string>UIInterfaceOrientationLandscapeRight</string>
                      </array>
                      <key>UIRequiresFullScreen</key>
                      <true/>
                      <key>UIStatusBarHidden</key>
                      <true/>
                  </plist>
              </ios>"""

          if 'UIFileSharingEnabled' not in xml:
              xml = xml.replace('</project>', ios_block + '\n</project>')
              print("Project.xml parcheado")
          else:
              print("Project.xml ya estaba parcheado")

          with open('Project.xml', 'w') as f:
              f.write(xml)
          PYEOF

      # ─────────────────────────────────────────
      # 11. Parchar Paths.hx — ruta de mods a Documents
      # ─────────────────────────────────────────
      - name: Patch Paths.hx for iOS mods directory
        run: |
          python3 << 'PYEOF'
          import os

          path = 'source/backend/Paths.hx'
          if not os.path.exists(path):
              path = 'source/Paths.hx'

          if not os.path.exists(path):
              print("No se encontro Paths.hx")
              exit(0)

          with open(path, 'r') as f:
              src = f.read()

          old = "inline static public function mods(?key:String = ''):String"
          new_func = """inline static public function mods(?key:String = ''):String
              {
                  #if ios
                  return lime.system.System.documentsDirectory + '/mods/' + key;
                  #else
                  return 'mods/' + key;
                  #end
              }
              @:deprecated inline static public function _modsOld(?key:String = ''):String"""

          if '#if ios' not in src and old in src:
              src = src.replace(old, new_func)
              with open(path, 'w') as f:
                  f.write(src)
              print("Paths.hx parcheado")
          else:
              print("Paths.hx ya estaba parcheado")
          PYEOF

      # ─────────────────────────────────────────
      # 12. Compilar
      # ─────────────────────────────────────────
      - name: Build iOS (unsigned)
        run: |
          haxelib run lime build ios -release 2>&1

      # ─────────────────────────────────────────
      # 13. Empaquetar .ipa
      # ─────────────────────────────────────────
      - name: Package .ipa
        run: |
          BUILD_DIR="export/release/ios/build/Release-iphoneos"
          APP=$(ls "$BUILD_DIR" | grep "\.app$" | head -1)
          if [ -z "$APP" ]; then
            echo "No se encontro .app en $BUILD_DIR"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$BUILD_DIR/$APP" Payload/
          zip -r "PsychEngine-0.7.3-iOS.ipa" Payload/
          echo "IPA listo: $(du -sh PsychEngine-0.7.3-iOS.ipa | cut -f1)"

      # ─────────────────────────────────────────
      # 14. Subir artifact
      # ─────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-0.7.3-iOS-unsigned
          path: PsychEngine-0.7.3-iOS.ipa
          retention-days: 30
